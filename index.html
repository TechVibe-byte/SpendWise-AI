<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#8B5CF6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#071224" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A modern daily expense tracker with financial insights and smart categorization.">
    <meta property="og:title" content="SpendWise">
    <meta property="og:description" content="A modern daily expense tracker with financial insights and smart categorization.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SpendWise">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <title>SpendWise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#8B5CF6',
              secondary: '#7C3AED',
              success: '#10B981',
              danger: '#EF4444',
              warning: '#F59E0B',
              surface: '#0F172A',
              background: '#071224',
              lightSurface: '#FFFFFF',
              lightBackground: '#F8FAFC',
              // Map indigo class styles to use the new Primary & Secondary specs
              indigo: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8B5CF6', // Primary
                600: '#7C3AED', // Secondary
                650: '#6d28d9',
                700: '#5b21b6',
                800: '#4c1d95',
                900: '#2e1065',
                950: '#1e0a4a',
              },
              emerald: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10B981', // Success
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
                950: '#022c22',
              },
              slate: {
                50: '#f8fafc',
                100: '#f1f5f9',
                150: '#e2e8f0',
                200: '#e2e8f0',
                250: '#cbd5e1',
                300: '#cbd5e1',
                400: '#94a3b8',
                450: '#64748b',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                850: '#1e293b',
                900: '#0F172A', // Surface
                905: '#0c1322',
                950: '#071224', // Background
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            padding: {
              'safe': 'env(safe-area-inset-bottom)',
            },
            margin: {
              'safe': 'env(safe-area-inset-bottom)',
            },
            spacing: {
              'safe': 'env(safe-area-inset-bottom)',
            }
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      /* Smooth theme transition */
      * {
        transition-property: background-color, border-color, color, fill, stroke;
        transition-duration: 200ms;
      }

      /* Global Modern Custom Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.35);
        border-radius: 9999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.7);
      }

      .dark ::-webkit-scrollbar-thumb,
      html.dark ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.25);
      }

      .dark ::-webkit-scrollbar-thumb:hover,
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.7);
      }

      /* Firefox support */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.35) transparent;
      }

      .dark * {
        scrollbar-color: rgba(148, 163, 184, 0.25) transparent;
      }
    </style>
</head>
  <body class="bg-slate-50 dark:bg-[#0B1220] overscroll-none">
    <div id="root">
      <!-- Premium Fintech Splash Screen / Loading Animation -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #0B1220; color: #ffffff; font-family: 'Inter', sans-serif;" id="initial-splash">
        <div style="position: relative; width: 100px; height: 100px; margin-bottom: 24px; animation: pulse 2s infinite ease-in-out;">
          <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%; border-radius: 24%;">
            <defs>
              <linearGradient id="splash_bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#8B5CF6"/>
                <stop offset="50%" stop-color="#7C3AED"/>
                <stop offset="100%" stop-color="#5b21b6"/>
              </linearGradient>
              <linearGradient id="splash_mid" x1="153.6" y1="256" x2="358.4" y2="256" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#22c55e"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="120" fill="url(#splash_bg)"/>
            <path d="M153.6 358.4C153.6 301.806 199.206 256 255.8 256H358.4V358.4C358.4 386.906 335.306 410 306.8 410H204.8C176.294 410 153.6 386.906 153.6 358.4Z" fill="white" opacity="0.92"/>
            <path d="M358.4 153.6C358.4 210.194 312.794 256 256.2 256H153.6V153.6C153.6 125.094 176.694 102 205.2 102H307.2C335.706 102 358.4 125.094 358.4 153.6Z" fill="#22c55e"/>
            <rect x="153.6" y="230.4" width="204.8" height="51.2" fill="url(#splash_mid)" opacity="0.9"/>
          </svg>
        </div>
        <h1 style="font-size: 24px; font-weight: 900; letter-spacing: -0.05em; margin: 0; color: #ffffff;">SpendWise</h1>
        <p style="font-size: 11px; font-weight: 700; color: #22c55e; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.15em;">Secure Financial Platform</p>
        
        <style>
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 15px rgba(34, 197, 94, 0.3)); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
